
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found – Dušan Ristić</title>

    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body class="error-page">

    <main class="error-container">

        <div class="error-code">404</div>

        <h1>Oops! Page not found.</h1>

        <p>
            The page you are looking for doesn't exist,
            has been moved, or is temporarily unavailable.
        </p>

        <div class="error-button-wrapper">

            <a href="https://codewithdusan.github.io/portfolio/" class="error-button">
                <span>←</span> Back to Home
            </a>

        </div>

        <div class="error-footer">
            DUŠAN RISTIĆ <span> / </span> JUNIOR .NET DEVELOPER
        </div>

    </main>
<div class="error-pointer">
    <svg viewBox="0 0 32 32">
        <path d="M3 2 L28 18 L17 20 L12 29 Z"
              fill="#ff2638"
              stroke="#ffffff"
              stroke-width="1.2"
              stroke-linejoin="round"/>
    </svg>
</div>
<script>
const pointer = document.querySelector(".error-pointer");

document.addEventListener("mousemove", function(event) {
    pointer.style.left = event.clientX + "px";
    pointer.style.top = event.clientY + "px";
});
</script>
</body>
</html>
